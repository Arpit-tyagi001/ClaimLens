services:
  db:
    image: pgvector/pgvector:pg16
    container_name: claimlens_db
    environment:
      POSTGRES_USER: claimlens
      POSTGRES_PASSWORD: claimlens_pass
      POSTGRES_DB: claimlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimlens -d claimlens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: